<title>WaiterApp</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d0e11;--s1:#15171c;--s2:#1d2026;--line:#272b33;--tx:#eef0f3;--mu:#8b919c;--ac:#6ea8fe;--ac2:#6ea8fe;--ok:#6fd3a0;--bad:#ff7d7d;--warn:#f2c46d;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
body{background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{padding:14px 12px 8px 20px;display:flex;align-items:flex-start;gap:8px}
h1,h2{font-weight:700;margin:0}
h1{font-size:32px;letter-spacing:.2px}h2{font-size:24px;margin-bottom:6px}
.sub{color:var(--mu);font-size:14px;margin-top:2px}
main{flex:1;overflow-y:auto;padding:8px 16px 120px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:rgba(24,21,18,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;color:var(--mu);border-radius:14px;transition:color .2s}
nav button.on{color:var(--ac)}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav svg{width:26px;height:26px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;transition:transform .15s}
.tap:active,.btn:active,.chip:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1;min-width:0}.r{text-align:right}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{width:46px;height:46px;border-radius:14px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--tx);flex:none}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;margin-top:4px;font-weight:600;background:var(--s2);color:var(--mu)}
.tag.ok{background:rgba(123,207,154,.14);color:var(--ok)}.tag.warn{background:rgba(240,179,90,.14);color:var(--warn)}.tag.bad{background:rgba(255,122,107,.14);color:var(--bad)}
.note{color:var(--mu);font-size:14px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:14px;background:var(--s2);color:var(--mu);font-size:14px;margin-bottom:12px}
.banner.ok{color:var(--ok);background:rgba(123,207,154,.1)}
.lnk{color:var(--ac);font-weight:600;padding:6px 4px}
.empty{text-align:center;padding:48px 20px;color:var(--mu)}.empty b{display:block;color:var(--tx);font-size:18px;margin:6px 0}.big{font-size:44px}
.sec{font-weight:600;font-size:15px;margin:18px 4px 10px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip,.chipb{flex:none;padding:10px 16px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:15px;transition:.2s;white-space:nowrap}
.chip.on{background:var(--ac);color:#1c1306;border-color:var(--ac);font-weight:600}
.inp{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--tx);font:inherit;font-size:16px;outline:0;margin:0;transition:border-color .2s;-webkit-appearance:none}
.inp:focus{border-color:var(--ac)}.inp.sm{margin-top:8px;padding:10px 14px;font-size:15px}
textarea.inp{resize:none;margin:12px 0}
label{display:block;color:var(--mu);font-size:14px;margin:14px 0 6px}label.chk{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:16px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:16px;font-weight:600;font-size:17px;margin-top:10px;transition:transform .15s;padding:0 16px}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1c1306}.btn.sec{background:var(--s2);border:1px solid var(--line)}.btn.dng{background:rgba(255,122,107,.12);color:var(--bad)}.btn.ghost{color:var(--mu)}
.btn.sm{width:auto;min-height:48px;margin:0}.two{display:flex;gap:10px}.two .btn{flex:1}
#fab{position:absolute;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:5}
.fabb{pointer-events:auto;padding:0 28px;height:56px;border-radius:999px;font-weight:700;font-size:17px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1c1306;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .15s}
.fabb:active{transform:scale(.95)}
.ib{width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:12px}.ib svg{width:22px;height:22px;stroke:var(--mu)}.ib.on svg{stroke:var(--ac)}
.pr{color:var(--tx);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}.dim{opacity:.55}
.step{display:flex;align-items:center;gap:2px;background:var(--s2);border-radius:14px;flex:none}.step button{width:44px;height:44px;font-size:22px;color:var(--ac)}.step b{min-width:22px;text-align:center}
.plus{width:44px;height:44px;border-radius:14px;background:var(--ac);color:#1c1306;font-size:26px;font-weight:600;flex:none}
.ln{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ln.col{display:block}.ln:last-child{border-bottom:0}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;padding:14px 0 4px}.tot b{font-size:26px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.tb{aspect-ratio:1;border-radius:16px;background:var(--s2);border:1px solid var(--line);font-weight:600;font-size:22px;position:relative;transition:transform .15s}.tb:active{transform:scale(.94);border-color:var(--ac)}
.tb.busy{color:var(--ac)}.tb.busy::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.hero{padding:22px 4px 10px}.big2{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums}
.tiles{display:flex;gap:10px;margin-bottom:10px}.tile{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 16px}.tile b{font-size:22px;font-weight:700}
.split{display:flex;height:8px;border-radius:9px;background:var(--bg);margin-top:12px;overflow:hidden}
.pd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;flex:none}
.payg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.payb{display:flex;align-items:center;gap:10px;min-height:60px;padding:0 14px;border-radius:16px;color:#fff;font-weight:600;font-size:17px;transition:transform .15s}.payb:active{transform:scale(.96)}
.map{width:100%;height:auto;display:block}
.wl{fill:var(--s1);stroke:#3a404a;stroke-width:3}.wl2{fill:none;stroke:#3a404a;stroke-width:3;stroke-linecap:round}.blk{fill:var(--s2);stroke:#3a404a;stroke-width:2}
.zl{fill:var(--mu);stroke:none;font:600 12px -apple-system,sans-serif;text-anchor:middle}.zl.h{paint-order:stroke;stroke:var(--s2);stroke-width:5px;stroke-linejoin:round}
.zt{cursor:pointer}.zt rect{fill:var(--s2);stroke:var(--ok);stroke-width:2;transition:fill .2s}.zt circle{fill:#3a404a;stroke:none}.zt text{fill:var(--tx);stroke:none;font:700 15px -apple-system,sans-serif;text-anchor:middle;pointer-events:none}
.zt.s-new rect{fill:rgba(110,168,254,.28);stroke:var(--ac)}.zt.s-served rect{fill:rgba(242,196,109,.25);stroke:var(--warn)}
.lg{display:flex;gap:16px;flex-wrap:wrap;color:var(--mu);font-size:13px;margin:4px 4px 8px}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:2px solid}.split i{display:block;height:100%;background:var(--ac);transition:width .4s}
.rk{width:26px;color:var(--mu);font-weight:600}
.err{color:var(--bad);font-size:14px;min-height:18px;margin-top:8px}
#ed{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#ed.on{transform:none}
.edh{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 8px}.pad{padding:0 16px 10px}
.elist{flex:1;overflow-y:auto;padding:0 16px 12px}.item{display:flex;align-items:center;gap:12px}
.edbar{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--s1)}.edbar .btn{margin:0}
#sheet{position:fixed;inset:0;z-index:30;pointer-events:none}#sheet.on{pointer-events:auto}
.back{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;transition:opacity .25s}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--s1);border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#sheet.on .back{opacity:1}#sheet.on .pn{transform:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-90px);background:var(--s2);border:1px solid var(--line);padding:12px 18px;border-radius:14px;z-index:40;transition:transform .3s;max-width:90%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.szs{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin-top:10px}.sz{display:flex;flex-direction:column;gap:6px}
.szb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 4px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-size:13px;color:var(--mu);transition:transform .15s,border-color .2s}.szb b{font-size:15px;color:var(--tx);white-space:nowrap}.szb:active{transform:scale(.95)}.szb.on{border-color:var(--ac)}
.step.sm{justify-content:center}.step.sm button{width:36px;height:36px;font-size:20px}
.szin{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

 if(!S.cats.length){toast('Сначала добавьте категорию');return catsSheet()}
 const i=id?S.items.find(x=>x.id===id):null,dc=i?i.cat:(ui.mcat!=='all'?ui.mcat:S.cats[0].id),hs=!!(i&&i.sizes&&i.sizes.length),sv=k=>{const s=hs&&i.sizes.find(z=>z.l===SIZES[k]);return s?s.p:''};
 sheet('<h2>'+(i?'Изменить позицию':'Новая позиция')+'</h2><label>Название</label><input class="inp" id="f-name" maxlength="60" placeholder="Например, Капучино" value="'+esc(i&&i.name)+'"><label>Категория</label><select class="inp" id="f-cat">'+S.cats.map(c=>'<option value="'+c.id+'" '+(c.id===dc?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select><label>Цена по объёму, ₸ (ненужное оставьте пустым)</label><div class="szin">'+SIZES.map((s,k)=>'<div><div class="sub">'+s+' л</div><input class="inp sm" style="margin:4px 0 0" id="f-s'+k+'" inputmode="numeric" maxlength="8" value="'+sv(k)+'"></div>').join('')+'</div><label>Цена без объёма, ₸</label><input class="inp" id="f-price" inputmode="numeric" maxlength="8" placeholder="1500" value="'+(i&&!hs?i.price:'')+'"><label>Описание</label><input class="inp" id="f-desc" maxlength="100" placeholder="Необязательно" value="'+esc(i&&i.desc)+'"><label class="chk"><input type="checkbox" id="f-vis" '+(i&&i.hidden?'':'checked')+'> Показывать при создании заказа</label><div class="err" id="ferr"></div><button class="btn pri" data-a="isave" data-id="'+(id||'')+'">Сохранить</button>'+(i?'<button class="btn dng" data-a="idel" data-id="'+id+'">Удалить</button>':'')+'<button class="btn ghost" data-a="sclose">Отмена</button>');
}
function catsSheet(){
 sheet('<h2>Категории</h2><div class="sub" style="margin-bottom:12px">Изменения названия сохраняются сразу</div>'+S.cats.map(c=>'<div class="row" style="margin-bottom:8px"><input class="inp sp" maxlength="30" value="'+esc(c.name)+'" data-ch="catname" data-id="'+c.id+'"><span class="sub">'+S.items.filter(i=>i.cat===c.id).length+'</span><button class="ib" data-a="cdel" data-id="'+c.id+'" aria-label="Удалить">'+TRASH+'</button></div>').join('')+'<div class="row" style="margin-top:14px"><input class="inp sp" id="newcat" maxlength="30" placeholder="Новая категория"><button class="btn pri sm" data-a="catadd">Добавить</button></div><button class="btn ghost" data-a="sclose">Готово</button>');
}

const noteH=o=>{const n=o.lines.filter(l=>l.note).map(l=>'<div>'+esc(l.name)+': '+esc(l.note)+'</div>').join(''),c=o.comment?'<div style="color:var(--tx)">'+esc(o.comment)+'</div>':'';return(c||n)?'<div class="note">'+c+n+'</div>':''};
function adminSheet(){
 if(!ui.adm){sheet('<h2>Администратор</h2><div class="sub" style="font-size:16px">Меню, цены, категории и число столиков меняются только в этом режиме.</div>'+(S.pin?'<input class="inp" id="apin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN-код" style="margin-top:14px"><div class="err" id="aerr"></div>':'')+'<button class="btn pri" data-a="alogin">Войти</button><button class="btn ghost" data-a="sclose">Отмена</button>');return}
 sheet('<h2>Настройки администратора</h2><button class="btn sec" data-a="goedit">Редактировать меню и цены</button><button class="btn sec" data-a="cats">Категории</button><button class="btn sec" data-a="ethno">Загрузить меню Ethno Coffee</button><label>PIN-код, 4 цифры (пусто: без PIN)</label><div class="row"><input class="inp sp" id="npin" type="password" inputmode="numeric" maxlength="4" value="'+esc(S.pin||'')+'"><button class="btn pri sm" data-a="pinsave">Сохранить</button></div><div class="err" id="aerr"></div><button class="btn dng" data-a="aexit">Выйти из режима</button><button class="btn ghost" data-a="sclose">Закрыть</button>');
}
/* ---------- hall + popular ---------- */
function popIds(){const m={};S.orders.forEach(o=>{if(o.status!=='cancelled')o.lines.forEach(l=>{m[l.itemId]=(m[l.itemId]||0)+l.qty})});return Object.entries(m).filter(e=>S.items.some(i=>i.id===e[0]&&!i.hidden)).sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0])}
function tState(n){const o=S.orders.filter(x=>x.table===n&&isActive(x)).sort((a,b)=>b.created-a.created)[0];return{o:o||null,s:o?(o.status==='served'?'served':'new'):'free'}}
const zt=(n,x,y,w,h,ch)=>'<g class="zt s-'+tState(n).s+'" data-a="ztbl" data-id="'+n+'">'+ch.map(c=>'<circle cx="'+c[0]+'" cy="'+c[1]+'" r="6"/>').join('')+'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6"/><text x="'+(x+w/2)+'" y="'+(y+h/2+5)+'">'+n+'</text></g>';
function hallMap(fl){
 if(fl===1)return'<svg viewBox="0 0 320 320" class="map"><rect class="wl" x="10" y="10" width="300" height="300" rx="12"/><path class="wl2" d="M88 10v62"/><path class="wl2" d="M88 78H140" stroke-dasharray="5 5"/><rect class="blk" x="140" y="22" width="100" height="50" rx="8"/><text class="zl" x="190" y="52">Касса</text><rect class="blk" x="172" y="110" width="34" height="150" rx="8"/><text class="zl" transform="translate(189 185) rotate(-90)">Барная стойка</text><rect class="blk" x="252" y="22" width="48" height="276" rx="6"/>'+Array.from({length:10},(_,i)=>'<path class="wl2" d="M252 '+(40+i*24)+'H300" style="stroke-width:2"/>').join('')+'<text class="zl h" transform="translate(276 160) rotate(-90)">Лестница</text><path d="M196 310h40" stroke="var(--ac)" stroke-width="5" stroke-linecap="round"/><text class="zl" x="216" y="294">Вход</text>'+[26,86,146,206,264].map((y,i)=>zt(i+1,30,y,38,38,[[19,y+19],[79,y+19]])).join('')+'</svg>';
 return'<svg viewBox="0 0 340 250" class="map"><rect class="wl" x="10" y="10" width="320" height="230" rx="12"/><path class="wl2" d="M10 52H150"/><path class="wl2" d="M312 10V70"/><rect class="blk" x="262" y="90" width="40" height="140" rx="6"/>'+Array.from({length:8},(_,i)=>'<path class="wl2" d="M262 '+(104+i*16)+'H302" style="stroke-width:2"/>').join('')+'<rect class="blk" x="302" y="90" width="28" height="140"/><text class="zl h" transform="translate(282 160) rotate(-90)">Лестница</text><path class="wl2" d="M10 176H250"/>'+zt(9,160,16,24,24,[])+zt(8,192,16,24,24,[])+zt(6,274,24,34,34,[[262,41]])+zt(10,70,96,30,64,[[57,112],[57,146],[113,112],[113,146]])+zt(7,200,96,30,64,[[187,112],[187,146],[243,112],[243,146]])+'</svg>';
}
function vHall(){
 const L=Array.from({length:10},(_,i)=>{const n=i+1;return Object.assign({n,c:S.orders.filter(x=>x.table===n&&isActive(x)).length},tState(n))}),busy=L.filter(x=>x.o).length;
 return{t:'Зал',s:'Занято '+busy+' из 10',h:'<div class="tiles"><div class="tile"><div class="sub">Свободно</div><b>'+(10-busy)+'</b></div><div class="tile"><div class="sub">Занято</div><b>'+busy+'</b></div></div><div class="chips">'+[1,2].map(f=>'<button class="chip '+(ui.fl===f?'on':'')+'" data-a="floor" data-id="'+f+'">'+f+' этаж</button>').join('')+'</div><div class="card">'+hallMap(ui.fl)+'</div><div class="lg"><span><i style="border-color:var(--ok)"></i>Свободен</span><span><i style="border-color:var(--ac);background:rgba(110,168,254,.28)"></i>Занят</span><span><i style="border-color:var(--warn);background:rgba(242,196,109,.25)"></i>Подан</span></div><div class="sec">Столы</div>'+L.map(x=>'<div class="card tap" data-a="ztbl" data-id="'+x.n+'"><div class="row"><div class="tbl">'+x.n+'</div><div class="sp"><b>Стол '+x.n+'</b><div class="sub">'+(x.n<6?'1 этаж':'2 этаж')+(x.o?', с '+tm(x.o.created)+(x.c>1?', заказов: '+x.c:''):'')+'</div>'+(x.o?badge(x.o):'<span class="tag ok">Свободен</span>')+'</div>'+(x.o?'<b class="pr">'+money(x.o.total)+'</b>':'')+'</div></div>').join('')};
}
/* ---------- actions ---------- */
const A={
tab:id=>{ui.tab=id;render()},
admin:()=>adminSheet(),
ethno:()=>confirmSheet('Заменить меню?','Текущее меню будет заменено меню Ethno Coffee с объёмами и ценами. Старые заказы и история не изменятся.','Заменить меню',()=>{const m=ethno();S.cats=m.cats;S.items=m.items;ui.mcat='all';save();render();toast('Меню загружено: '+m.items.length+' позиций')},true),
floor:id=>{ui.fl=+id===2?2:1;render()},
ztbl:n=>{const x=tState(+n);if(x.o)return A.tbl(n);if(!cur())return confirmSheet('Смена не открыта','Чтобы создавать заказы, откройте смену.','Открыть смену',()=>{doOpen();A.tbl(n)});A.tbl(n)},
alogin:()=>{if(S.pin&&$('#apin').value!==S.pin){$('#aerr').textContent='Неверный PIN';return}ui.adm=true;closeSheet();render();toast('Режим администратора включён')},
aexit:()=>{ui.adm=false;closeSheet();render();toast('Режим администратора выключен')},
goedit:()=>{closeSheet();ui.tab='menu';render()},
pinsave:()=>{const v=$('#npin').value.trim();if(v&&!/^\d{4}$/.test(v)){$('#aerr').textContent='PIN: ровно 4 цифры';return}S.pin=v;save();$('#aerr').textContent='';toast(v?'PIN сохранён':'PIN отключён')},
gshift:()=>{ui.tab='shift';render()},
sclose:()=>{closeSheet();render();if(ed)edList()},
cok:()=>{const f=pending;pending=null;closeSheet();if(f)f()},
new:()=>{if(!cur())return confirmSheet('Смена не открыта','Чтобы создавать заказы, откройте смену.','Открыть смену',()=>{doOpen();pickTable()});pickTable()},
tbl:n=>{n=+n;const b=S.orders.filter(o=>o.table===n&&isActive(o));
 if(b.length)return sheet('<h2>Стол '+n+' занят</h2><div class="sub">Есть неоплаченный заказ на '+money(b[0].total)+'</div><button class="btn pri" data-a="open" data-id="'+b[0].id+'">Открыть заказ</button><button class="btn sec" data-a="starttbl" data-id="'+n+'">Новый заказ на этот стол</button><button class="btn ghost" data-a="sclose">Отмена</button>');
 startEd(n)},
starttbl:n=>startEd(+n),
open:id=>openOrder(id),
eadd:(id,b)=>{if(!ed)return;addQty(id,1,b.dataset.s);edList();edBar()},
esub:(id,b)=>{if(!ed)return;addQty(id,-1,b.dataset.s);edList();edBar()},
cadd:(id,b)=>{addQty(id,1,b.dataset.s);edList();edBar();cartSheet()},
csub:(id,b)=>{addQty(id,-1,b.dataset.s);edList();edBar();cartSheet()},
ecat:id=>{ed.cat=id;edChips();edList()},
cart:()=>{if(ed&&ed.lines.length)cartSheet()},
edx:()=>{if(ed.dirty&&ed.lines.length)confirmSheet('Выйти без сохранения?','Изменения в заказе будут потеряны.','Выйти',closeEd,true);else closeEd()},
osave:()=>{
 if(!ed||!ed.lines.length)return;
 const L=ed.lines.map(l=>({itemId:l.itemId,size:l.size||'',name:l.name,price:l.price,qty:l.qty,note:l.note.trim()})),c=ed.comment.trim();
 if(ed.id){const o=ordById(ed.id);if(!o||!isActive(o)){toast('Заказ уже закрыт');closeEd();closeSheet();return render()}o.lines=L;o.comment=c;o.total=sum(L)}
 else{const sh=cur();if(!sh){toast('Смена закрыта, откройте её');return}S.orders.push({id:uid(),shiftId:sh.id,table:ed.table,status:'new',pay:null,comment:c,lines:L,total:sum(L),created:Date.now(),paidAt:null})}
 save();closeEd();closeSheet();render();toast('Заказ сохранён')},
serve:id=>{const o=ordById(id);if(o&&isActive(o)){o.status='served';save();render();openOrder(id)}},
pay:(id,b)=>{const o=ordById(id),sh=cur();if(!o||!isActive(o))return;if(!sh){toast('Откройте смену, чтобы принять оплату');return}
 const m=b.dataset.m;o.pay=PAY[m]?m:'cash';o.paidAt=Date.now();o.shiftId=sh.id;save();closeSheet();render();toast('Оплачено: '+money(o.total))},
oedit:id=>{const o=ordById(id);if(!o||!isActive(o))return;closeSheet();ed={id:o.id,table:o.table,lines:o.lines.map(l=>({...l})),comment:o.comment||'',q:'',cat:popIds().length?'pop':'all',dirty:false};openEd()},
ocancel:id=>confirmSheet('Отменить заказ?','Заказ останется в истории со статусом «Отменён».','Отменить заказ',()=>{const o=ordById(id);if(o&&isActive(o)){o.status='cancelled';save();render();toast('Заказ отменён')}},true),
oshift:()=>{doOpen();toast('Смена открыта')},
cshift:()=>{const sh=cur();if(!sh)return;const st=stats(sh.id),un=S.orders.filter(isActive).length;
 confirmSheet('Закрыть смену?','Выручка: '+money(st.rev)+', оплаченных заказов: '+st.n+'.'+(un?' Неоплаченных заказов: '+un+'. Они останутся в списке, оплатить их можно в следующей смене.':''),'Закрыть смену',()=>{sh.close=Date.now();sh.summary={rev:st.rev,n:st.n,avg:st.avg,cash:st.cash,kaspi:st.kaspi,halyk:st.halyk,card:st.card};save();render();toast('Смена закрыта')},true)},
tdec:()=>{S.tables=Math.max(1,S.tables-1);save();adminSheet()},
tinc:()=>{S.tables=Math.min(60,S.tables+1);save();adminSheet()},
hf:id=>{ui.hf=id;render()},
mcat:id=>{ui.mcat=id;mChips();mList()},
madd:()=>itemForm(),
medit:id=>itemForm(id),
mtoggle:id=>{const i=S.items.find(x=>x.id===id);if(i){i.hidden=!i.hidden;save();mList();toast(i.hidden?'Скрыто из заказов':'Снова в меню')}},
isave:id=>{
 const name=$('#f-name').value.trim(),er=$('#ferr'),ok=v=>/^\d+$/.test(v)&&+v>=1&&+v<=1e7,sizes=[];
 if(!name){er.textContent='Введите название';return}
 for(let k=0;k<SIZES.length;k++){const v=$('#f-s'+k).value.replace(/\s/g,'');if(v){if(!ok(v)){er.textContent='Цена '+SIZES[k]+' л: целое число от 1 до 10 000 000';return}sizes.push({l:SIZES[k],p:+v})}}
 let p=$('#f-price').value.replace(/\s/g,'');
 if(sizes.length)p=Math.min(...sizes.map(s=>s.p));else{if(!ok(p)){er.textContent='Укажите цену (по объёму или без объёма)';return}p=+p}
 const d={name,price:p,sizes:sizes.length?sizes:null,cat:$('#f-cat').value,desc:$('#f-desc').value.trim(),hidden:!$('#f-vis').checked};
 if(id){const i=S.items.find(x=>x.id===id);if(i)Object.assign(i,d)}else S.items.push({id:uid(),...d});
 save();closeSheet();render();toast('Сохранено')},
idel:id=>{const i=S.items.find(x=>x.id===id);if(!i)return;confirmSheet('Удалить «'+i.name+'»?','Старые заказы не изменятся: название и цена в них сохранены.','Удалить',()=>{S.items=S.items.filter(x=>x.id!==id);save();render();toast('Удалено')},true)},
cats:()=>catsSheet(),
catadd:()=>{const inp=$('#newcat'),n=inp.value.trim();
 if(!n){toast('Введите название категории');return}
 if(S.cats.some(c=>c.name.toLowerCase()===n.toLowerCase())){toast('Такая категория уже есть');return}
 S.cats.push({id:uid(),name:n});save();catsSheet()},
cdel:id=>{if(S.items.some(i=>i.cat===id)){toast('Сначала удалите или перенесите блюда этой категории');return}
 S.cats=S.cats.filter(c=>c.id!==id);if(ui.mcat===id)ui.mcat='all';save();catsSheet()}
};
function doOpen(){if(cur())return;S.shifts.push({id:uid(),open:Date.now(),close:null,summary:null});save();render()}

const LOCK=new Set(['osave','pay','isave','idel','cok','oshift','catadd']);let lk=0;
const ADM=new Set(['madd','medit','mtoggle','isave','idel','cats','catadd','cdel','tdec','tinc','pinsave','goedit','ethno']);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
 if(ADM.has(a)&&!ui.adm){toast('Включите режим администратора в настройках');return}
 if(LOCK.has(a)){const t=Date.now();if(t-lk<500)return;lk=t}
 if(A[a])A[a](b.dataset.id,b);
});
document.addEventListener('input',e=>{
 const t=e.target,k=t.dataset.in;if(!k)return;
 if(k==='mq'){ui.mq=t.value;mList()}
 else if(k==='edq'&&ed){ed.q=t.value;edList()}
 else if(k==='note'&&ed){const l=ed.lines.find(x=>x.itemId===t.dataset.id&&(x.size||'')===(t.dataset.s||''));if(l){l.note=t.value;ed.dirty=true}}
 else if(k==='ocom'&&ed){ed.comment=t.value;ed.dirty=true}
});
document.addEventListener('change',e=>{
 const t=e.target;if(t.dataset.ch!=='catname')return;
 const c=S.cats.find(x=>x.id===t.dataset.id),n=t.value.trim();if(!c)return;
 if(!n||S.cats.some(x=>x!==c&&x.name.toLowerCase()===n.toLowerCase())){toast(n?'Такая категория уже есть':'Название не может быть пустым');t.value=c.name;return}
 c.name=n;save();
});

$('#nav').innerHTML=TABS.map(t=>'<button data-a="tab" data-id="'+t[0]+'"><svg viewBox="0 0 24 24">'+IC[t[0]]+'</svg>'+t[1]+'</button>').join('');
render();
</script>
</body>
</html>
